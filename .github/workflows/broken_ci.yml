name: Broken CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate-branch-and-commits:
    name: Validate name of branches & commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobate name of branch
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Rama detectada: $BRANCH_NAME"
          if [[ ! "$BRANCH_NAME" =~ ^1234- ]]; then
            echo "❌ El nombre de la rama debe empezar por '1234-'"
            exit 1
          fi
          echo "✔ Nombre de rama válido"

      - name: Comprobate format of commits
        run: |
          echo "Validando commits..."
          git fetch origin ${{ github.head_ref }}
          COMMITS=$(git log origin/${{ github.base_ref }}..origin/${{ github.head_ref }} --pretty=format:"%s")


          INVALID=0
          while IFS= read -r line; do
            if [[ ! "$line" =~ ^1234- ]]; then
              echo "❌ Commit inválido: $line"
              INVALID=1
            fi
          done <<< "$COMMITS"

          if [[ $INVALID -eq 1 ]]; then
            echo "❌ Todos los commits deben empezar por '1234-'"
            exit 1
          fi

          echo "✔ Todos los commits tienen formato válido"

  build-and-test:
    name: Build & Tests
    runs-on: ubuntu-latest
    needs: validate-branch-and-commits

    steps:
      - name: Checkout of repositori
        uses: actions/checkout@v4

      - name: Configure Node (example)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instal dependencis
        run: npm install

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build
